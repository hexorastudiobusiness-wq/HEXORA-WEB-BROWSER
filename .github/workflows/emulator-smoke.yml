name: Emulator smoke test

# Reproduces the upgrade path (previous shipped build -> current build)
# on an emulator and captures the real logcat crash trace, because the
# dev sandbox has no Android device attached. The emulator is created
# and booted by hand: the ready-made emulator actions timed out waiting
# for boot on the hosted runners.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    # Apple-silicon runners run the ARM emulator natively, and ARM is
    # the architecture real phones use.
    runs-on: macos-14
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hexora-debug-keystore-v1

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > setup.log 2>&1 || true
          PLATFORM_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -Vu | tail -1 || true)
          echo "PLATFORM_PKG=$PLATFORM_PKG" | tee -a setup.log
          test -n "$PLATFORM_PKG"
          "$SDKMANAGER" "$PLATFORM_PKG" "build-tools;37.0.0" \
            "emulator" "platform-tools" \
            "system-images;android-34;google_apis;arm64-v8a" 2>&1 | tee -a setup.log

      - name: Build current debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Download previous shipped debug APK (v0.4.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          gh release download debug-799c44b \
            --pattern 'app-arm64-v8a-debug.apk' \
            --dir old

      - name: Create and boot emulator
        run: |
          set -o pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n smoke -k "system-images;android-34;google_apis;arm64-v8a" \
            --device "pixel_6" --force
          "$ANDROID_HOME/emulator/emulator" -avd smoke \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -wipe-data \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "emulator booted after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          adb shell getprop sys.boot_completed
          adb shell input keyevent 82 || true

      - name: Run upgrade smoke test
        run: |
          : > verdicts.txt
          echo "=== fresh install of CURRENT build ==="
          adb install -r app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          adb shell am start -W -n com.example.browser/.MainActivity || true
          sleep 20
          if adb shell pidof com.example.browser; then
            echo "FRESH_CURRENT_RUNNING" | tee -a verdicts.txt
          else
            echo "FRESH_CURRENT_DEAD" | tee -a verdicts.txt
          fi
          adb logcat -d > fresh-logcat.txt
          adb uninstall com.example.browser || true
          adb logcat -c || true
          echo "=== install previous build v0.4.2 ==="
          adb install -r old/app-arm64-v8a-debug.apk
          adb shell am start -W -n com.example.browser/.MainActivity || true
          sleep 20
          adb shell pidof com.example.browser && echo OLD_RUNNING || echo OLD_DEAD
          adb logcat -c || true
          echo "=== upgrade to CURRENT build ==="
          adb install -r app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          adb shell am start -W -n com.example.browser/.MainActivity || true
          sleep 20
          if adb shell pidof com.example.browser; then
            echo "UPGRADED_RUNNING" | tee -a verdicts.txt
          else
            echo "UPGRADED_DEAD" | tee -a verdicts.txt
          fi
          adb logcat -d > upgrade-logcat.txt

      # This step used to run on every push (if: always()), so each run filed a
      # report whether or not anything had gone wrong — and, because nothing
      # closed them, the issue list filled with reports whose whole content was
      # "logcat missing" while the emulator had never booted. An issue is only
      # worth creating when there is a crash or a dead process to look at.
      - name: Decide whether there is anything to report
        id: verdict
        if: always()
        run: |
          # cat, not grep -l: grep exits non-zero when *any* named file is
          # missing, so a run that captured one log and not the other would
          # have been read as "no crash" even when the log it did capture holds
          # a FATAL EXCEPTION.
          found="false"
          if cat fresh-logcat.txt upgrade-logcat.txt 2>/dev/null | grep -q "FATAL EXCEPTION"; then
            found="true"
          fi
          if cat verdicts.txt 2>/dev/null | grep -qE "FRESH_CURRENT_DEAD|UPGRADED_DEAD"; then
            found="true"
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "crash-or-dead-app: $found"

      - name: Report crash traces in an issue
        if: always() && steps.verdict.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Emulator smoke test for commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo
            for f in fresh-logcat.txt upgrade-logcat.txt; do
              if [ -f "$f" ]; then
                echo "## $f — FATAL EXCEPTION excerpts"
                echo '```text'
                grep -n "FATAL EXCEPTION" -A 45 "$f" | head -200 || echo "(no FATAL EXCEPTION found)"
                echo '```'
                echo "## $f — RUNNING/DEAD markers are in the run log; AndroidRuntime:"
                echo '```text'
                grep -n "AndroidRuntime" "$f" | head -60 || true
                echo '```'
              else
                echo "## $f missing"
                echo '```text'
                tail -50 emulator.log 2>/dev/null || true
                echo '```'
              fi
            done
          } > smoke-report.md
          gh issue create \
            --title "Emulator smoke report ${GITHUB_SHA::7}" \
            --body-file smoke-report.md
