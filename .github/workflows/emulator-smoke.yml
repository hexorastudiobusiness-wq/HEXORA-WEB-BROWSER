name: Emulator smoke test

# Reproduces the upgrade path (previous shipped build -> current build)
# on an emulator and captures the real logcat crash trace, because the
# dev sandbox has no Android device attached.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hexora-debug-keystore-v1

      - name: Install Android SDK platform 37
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > setup.log 2>&1 || true
          PLATFORM_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -Vu | tail -1 || true)
          echo "PLATFORM_PKG=$PLATFORM_PKG" | tee -a setup.log
          test -n "$PLATFORM_PKG"
          "$SDKMANAGER" "$PLATFORM_PKG" "build-tools;37.0.0" 2>&1 | tee -a setup.log

      - name: Build current debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Download previous shipped debug APK (v0.4.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          gh release download debug-799c44b \
            --pattern 'app-x86_64-debug.apk' \
            --dir old

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run upgrade smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            echo "=== fresh install of CURRENT build ==="
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb shell am start -W -n com.example.browser/.MainActivity || true
            sleep 15
            adb shell pidof com.example.browser && echo FRESH_CURRENT_RUNNING || echo FRESH_CURRENT_DEAD
            adb logcat -d > fresh-logcat.txt
            adb uninstall com.example.browser || true
            adb logcat -c || true
            echo "=== install previous build v0.4.2 ==="
            adb install -r old/app-x86_64-debug.apk
            adb shell am start -W -n com.example.browser/.MainActivity || true
            sleep 15
            adb shell pidof com.example.browser && echo OLD_RUNNING || echo OLD_DEAD
            adb logcat -c || true
            echo "=== upgrade to CURRENT build ==="
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb shell am start -W -n com.example.browser/.MainActivity || true
            sleep 15
            adb shell pidof com.example.browser && echo UPGRADED_RUNNING || echo UPGRADED_DEAD
            adb logcat -d > upgrade-logcat.txt

      - name: Report crash traces in an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Emulator smoke test for commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo
            for f in fresh-logcat.txt upgrade-logcat.txt; do
              if [ -f "$f" ]; then
                echo "## $f — FATAL EXCEPTION excerpts"
                echo '```text'
                grep -n "FATAL EXCEPTION" -A 45 "$f" | head -200 || echo "(no FATAL EXCEPTION found)"
                echo '```'
                echo "## $f — AndroidRuntime lines"
                echo '```text'
                grep -n "AndroidRuntime" "$f" | head -60 || true
                echo '```'
              else
                echo "## $f missing"
              fi
            done
          } > smoke-report.md
          gh issue create \
            --title "Emulator smoke report ${GITHUB_SHA::7}" \
            --body-file smoke-report.md
