name: Build signed release

# Release builds are signed with the dedicated Hexora release key. The
# keystore only ever exists as GitHub Actions secrets; it is decoded into
# the runner's temp directory for the build and never touches the repo.

on:
  workflow_dispatch:
  # One-time bootstrap on this development branch (manual dispatch needs
  # the workflow on the default branch): pushing the marker file below
  # runs the signed release build once.
  push:
    branches:
      - 'arena/**'
    paths:
      - signing/build-release.request

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 37
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > setup.log 2>&1 || true
          PLATFORM_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -Vu | tail -1 || true)
          echo "PLATFORM_PKG=$PLATFORM_PKG" | tee -a setup.log
          test -n "$PLATFORM_PKG"
          "$SDKMANAGER" "$PLATFORM_PKG" "build-tools;37.0.0" 2>&1 | tee -a setup.log

      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HEXORA_WEB_BROWSER_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEXORA_WEB_BROWSER_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Secret for release signing (see signing/README.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore into runner temp
        env:
          KEYSTORE_B64: ${{ secrets.HEXORA_WEB_BROWSER_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hexora-release.p12"
          chmod 600 "$RUNNER_TEMP/hexora-release.p12"

      - name: Build signed release APKs and AAB
        env:
          HEXORA_RELEASE_STORE_FILE: ${{ runner.temp }}/hexora-release.p12
          HEXORA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HEXORA_WEB_BROWSER_RELEASE_KEYSTORE_PASSWORD }}
          HEXORA_RELEASE_STORE_TYPE: PKCS12
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee gradle.log

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hexora-release.p12"

      - name: Upload signed release files as workflow artifact
        # Artifact storage can be quota-limited; the GitHub Release below is
        # the canonical distribution, so do not fail publishing on quota.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hexora-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish signed files to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          NOTES="Signed release build of Hexora Browser $VERSION (commit $GITHUB_SHA). APKs: arm64-v8a (most modern phones), armeabi-v7a (old 32-bit phones), x86_64 (emulators); the AAB is for store upload. Release builds use the dedicated release key, so uninstall the debug build first — Android will not update across different signatures."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/bundle/release/*.aab \
              --clobber
          else
            gh release create "$TAG" \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/bundle/release/*.aab \
              --target "$GITHUB_SHA" \
              --title "Hexora Browser $VERSION" \
              --notes "$NOTES"
          fi

      - name: Report failure log in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="CI release build failure ${GITHUB_SHA::7}"
          if gh issue list --state open --search "$TITLE in:title" --json title \
               --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "An open issue for $TITLE already exists; not filing another."
            exit 0
          fi
          {
            echo "Signed release build failed for commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo
            echo '```text'
            cat setup.log gradle.log 2>/dev/null | tail -n 350; test -f setup.log -o -f gradle.log || echo "(no logs captured)"
            echo '```'
          } > failure-report.md
          gh issue create \
            --title "$TITLE" \
            --body-file failure-report.md

      - name: Close release-failure issues from earlier commits
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search 'CI release build failure in:title' \
            --limit 100 --json number --jq '.[].number' | while read -r number; do
              gh issue close "$number" \
                --comment "Fixed: $GITHUB_SHA builds green (run $GITHUB_RUN_ID)."
            done
