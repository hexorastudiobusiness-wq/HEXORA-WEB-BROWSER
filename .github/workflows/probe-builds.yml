name: Probe builds

# Diagnostic builds for the 1.0.0 bug hunt. Two APKs that separate "the release
# build type behaves differently" from "the changed applicationId / a fresh
# install behaves differently":
#
#   probe-A  release build type, old applicationId (com.example.browser),
#            signed with the debug key so it installs over an existing debug app
#            and keeps its data
#   probe-B  debug build type, new applicationId (com.hexora.browser)
#
# Neither is signed with the release key: these are for a phone, not for a
# release page.

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 37
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > setup.log 2>&1 || true
          PLATFORM_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -Vu | tail -1 || true)
          echo "PLATFORM_PKG=$PLATFORM_PKG" | tee -a setup.log
          test -n "$PLATFORM_PKG"
          "$SDKMANAGER" "$PLATFORM_PKG" "build-tools;37.0.0" 2>&1 | tee -a setup.log

      - name: Build probe A — release build type, old applicationId
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            -PhexoraApplicationId=com.example.browser \
            -PhexoraProbeDebugSigning=1 --stacktrace 2>&1 | tee gradle-a.log
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk probe-A-release-oldid.apk

      - name: Build probe B — debug build type, new applicationId
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            -PhexoraApplicationId=com.hexora.browser --stacktrace 2>&1 | tee gradle-b.log
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk probe-B-debug-newid.apk

      - name: Read back what was actually built
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)
          {
            for apk in probe-A-release-oldid.apk probe-B-debug-newid.apk; do
              echo "### $apk"
              ls -l "$apk"
              "$AAPT" dump badging "$apk" | sed -n '1p;/^package:/p'
              echo
            done
          } | tee apk-info.txt

      - name: Publish the probes as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="probe-${GITHUB_SHA::7}"
          NOTES=$(cat <<'NOTES_EOF'
          Diagnostic builds for the 1.0.0 bug hunt. Install **one** at a time and
          note which one misbehaves.

          - `probe-A-release-oldid.apk` — release build type, applicationId
            `com.example.browser`, signed with the debug key. Installs **over**
            an existing debug install and keeps its data.
          - `probe-B-debug-newid.apk` — debug build type, applicationId
            `com.hexora.browser`. Needs the 1.0.0 build uninstalled first,
            because the signing key differs.

          Neither build is signed with the release key.
          NOTES_EOF
          )
          printf '%s\n\n%s\n' "$NOTES" "$(cat apk-info.txt)" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" probe-*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" probe-*.apk \
              --target "$GITHUB_SHA" \
              --title "Probe builds ${GITHUB_SHA::7}" \
              --prerelease \
              --notes-file notes.md
          fi

      - name: Report failure log in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="CI probe build failure ${GITHUB_SHA::7}"
          {
            echo "Probe build failed for commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo
            echo '```text'
            cat setup.log gradle-a.log gradle-b.log 2>/dev/null | tail -n 250
            echo '```'
          } > failure-report.md
          gh issue create --title "$TITLE" --body-file failure-report.md
